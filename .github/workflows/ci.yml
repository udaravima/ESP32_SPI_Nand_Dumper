name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  host:
    name: Host tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # The generated chip table is committed; fail if chips.yml changed
      # without regenerating it.
      - name: Generated chip table is up to date
        run: |
          python tools/gen_chips.py chips.yml src/nand_chips_generated.h
          git diff --exit-code src/nand_chips_generated.h

  native:
    name: Native tests (pio test -e native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio pyyaml
      - run: pio test -e native

  firmware:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32-s3-devkitc-1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio pyyaml
      - run: pio run -e ${{ matrix.env }}
