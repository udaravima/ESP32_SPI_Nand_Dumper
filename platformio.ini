; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
; pio test does not build src/ by default — enable it so the pure modules link.
test_build_src = yes
; -<*> excludes the Arduino/ESP-IDF sources (main/driver/wifi) that can't
; build on host; only the ESP-IDF-free pure modules are compiled.
build_src_filter = -<*> +<nand_chips.cpp> +<dump_header.cpp>
build_flags = -I src
