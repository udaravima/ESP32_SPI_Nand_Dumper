; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200
; Regenerate src/nand_chips_generated.h from chips.yml on every build.
extra_scripts = pre:tools/gen_chips.py

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

[env:native]
platform = native
test_framework = unity
; pio test does not build src/ by default — enable it so the pure modules link.
test_build_src = yes
; -<*> excludes the Arduino/ESP-IDF sources (main/driver/wifi) that can't
; build on host; only the ESP-IDF-free pure modules are compiled.
build_src_filter = -<*> +<nand_chips.cpp> +<dump_header.cpp>
build_flags = -I src
