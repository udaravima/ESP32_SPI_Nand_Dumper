; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Bare `pio run` builds only the firmware targets. The `native` env is a
; host test environment (no main() outside test/) — use `pio test -e native`.
default_envs = esp32dev

[env]
monitor_speed = 115200
; Regenerate src/nand_profiles_generated.h from db/ on every build.
extra_scripts = pre:tools/gen_profiles.py

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

[env:native]
platform = native
test_framework = unity
; pio test does not build src/ by default — enable it so the pure modules link.
test_build_src = yes
; -<*> excludes the Arduino/ESP-IDF sources (main/driver/wifi) that can't
; build on host; only the ESP-IDF-free pure modules are compiled.
build_src_filter = -<*> +<nand_profile.cpp> +<dump_header.cpp> +<config_store.cpp> +<sys_info.cpp> +<nand_seq.cpp> +<nand_session.cpp>
build_flags = -I src
