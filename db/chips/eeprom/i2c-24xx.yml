# I2C serial EEPROMs, written by hand from the Linux at24 driver's chip table
# (drivers/nvmem/at24.c, GPL-2.0-or-later: sizes and 8/16-bit addressing, as
# facts) and the vendors' datasheets (page-write size, device-address bits).
# Not yet checked on hardware. `page_write` is informational: the firmware
# never writes.

"24C01":
  family: i2c-eeprom
  profile: eeprom-generic
  geometry: {size_bytes: 128, addr_bytes: 1, dev_addr_bits: 0, dev_addr_shift: 0}
  page_write: 8
  vcc_mv: 3300
  resident: true
  aliases: ["AT24C01", "24LC01B", "24AA01", "M24C01", "CAT24C01", "BR24G01"]
  source: "https://github.com/torvalds/linux/blob/a90ee4305c4a5df72c11b31dacfdc76e00fcf78a/drivers/nvmem/at24.c"
  datasheet: "Linux at24 id 24c01; vendor datasheets of AT24C01, 24LC01B, 24AA01"

