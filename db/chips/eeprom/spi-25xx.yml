# SPI serial EEPROMs and FRAMs (25-series), written by hand from the vendors'
# datasheets (size, address width, page-write size) and the Linux at25
# binding's address-width rules (Documentation/devicetree/bindings/eeprom/
# at25.yaml, GPL-2.0: 8, 9 = A8 in opcode bit 3, 16 or 24 bits). Not yet
# checked on hardware. `page_write` is informational (0 for FRAM).

"25xx010":
  family: spi-eeprom
  profile: eeprom-generic
  geometry: {size_bytes: 128, addr_bytes: 1, dev_addr_bits: 0, dev_addr_shift: 0}
  page_write: 16
  vcc_mv: 3300
  resident: true
  aliases: ["25LC010A", "25AA010A", "AT25010B", "M95010", "CAT25010"]
  source: "https://github.com/torvalds/linux/blob/a90ee4305c4a5df72c11b31dacfdc76e00fcf78a/Documentation/devicetree/bindings/eeprom/at25.yaml"
  datasheet: "Vendor datasheets of 25LC010A, 25AA010A, AT25010B"

